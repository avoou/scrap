name: Tests

on:
  push:
    branches:
      - main

jobs:
  testTransform:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: setUp Python
        uses: actions/setup-python@v4
        with:
          python-version: '>=3.10 <3.11'
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Test
        run: python -m unittest tests/test_Transform.py -v